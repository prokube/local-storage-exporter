name: Docker build and push release image

on:
  push:
    tags: [ "v*" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release tag
        env:
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]]; then
            echo "Release tag must match vX.Y.Z or vX.Y.Z-rcN"
            exit 1
          fi

          git fetch origin main
          if ! git merge-base --is-ancestor "$COMMIT_SHA" origin/main; then
            echo "Tag is not on main branch"
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Check immutable release image
        id: release-image
        env:
          IMAGE: europe-west3-docker.pkg.dev/prokube/releases/local-storage-exporter:${{ github.ref_name }}
        run: |
          if output=$(gcloud artifacts docker images describe "$IMAGE" 2>&1); then
            echo "$IMAGE already exists; preserving the immutable release artifact"
            echo "should_push=false" >> "$GITHUB_OUTPUT"
          elif [[ "$output" == *"NOT_FOUND"* || "$output" == *"Image not found"* ]]; then
            echo "should_push=true" >> "$GITHUB_OUTPUT"
          else
            echo "$output" >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        if: steps.release-image.outputs.should_push == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to Google Artifact Registry
        if: steps.release-image.outputs.should_push == 'true'
        uses: docker/login-action@v4
        with:
          registry: europe-west3-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCP_SA_KEY }}

      - name: Build and push Docker image
        if: steps.release-image.outputs.should_push == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: europe-west3-docker.pkg.dev/prokube/releases/local-storage-exporter:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
