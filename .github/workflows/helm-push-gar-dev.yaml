name: Helm package development chart to GAR

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "helm_chart/**"

jobs:
  package-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Log in to Google Artifact Registry
        uses: docker/login-action@v4
        with:
          registry: europe-west3-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCP_SA_KEY }}

      - name: Package and push development chart
        run: |
          set -euo pipefail

          CURRENT_VERSION=$(awk '/^version:/ {print $2}' helm_chart/Chart.yaml)
          DEV_VERSION="${CURRENT_VERSION}-dev.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          helm package helm_chart \
            --version "$DEV_VERSION" \
            --destination ./helm_chart/dist
          helm push \
            "./helm_chart/dist/local-storage-exporter-${DEV_VERSION}.tgz" \
            oci://europe-west3-docker.pkg.dev/prokube/development/helm
