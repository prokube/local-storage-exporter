name: Helm package and push development chart

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "helm_chart/**"

jobs:
  package-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v3
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Log in to Google Artifact Registry
      uses: docker/login-action@v4
      with:
        registry: europe-west3-docker.pkg.dev
        username: _json_key
        password: ${{ secrets.GCP_SA_KEY }}

    - name: Package the Helm chart and push to Artifact Registry
      run: |
        set -euo pipefail

        # Use a unique SemVer prerelease for each run and retry.
        CURRENT_VERSION=$(grep '^version:' helm_chart/Chart.yaml | awk '{print $2}')
        DEV_VERSION="${CURRENT_VERSION}-dev.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"

        # Helm packages the chart as {chart-name}-{version}.tgz
        helm package helm_chart --version "$DEV_VERSION" --destination ./helm_chart/dist

        # Push the chart (helm push automatically uses the version from Chart.yaml)
        helm push "./helm_chart/dist/local-storage-exporter-${DEV_VERSION}.tgz" oci://europe-west3-docker.pkg.dev/prokube/development/helm
